<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>opennib menu</title>
    <link rel="stylesheet" href="./tray.css" />
  </head>
  <body>
    <div id="popover">
      <!-- ─── main view ─────────────────────────────────────────── -->
      <section id="view-main" class="view">
        <header class="popover-head">
          <div class="brand-tile" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path
                d="M 5 6 Q 5 3, 8 3 L 16 3 Q 19 3, 19 6 L 19 12 L 12 21.5 L 5 12 Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <circle cx="12" cy="7.5" r="1.6" fill="currentColor" />
              <line
                x1="12"
                y1="9.7"
                x2="12"
                y2="17"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-wordmark">opennib</span>
            <span id="status-line" class="mono">READY</span>
          </div>
          <button
            id="tray-toggle"
            type="button"
            class="tray-toggle on"
            role="switch"
            aria-checked="true"
            aria-label="Enable dictation listener"
          >
            <span class="tray-toggle-knob"></span>
          </button>
        </header>

        <div id="hint-pill" class="hint-pill">
          <span class="hint-text">Hold to dictate anywhere</span>
          <kbd class="hint-key mono">fn</kbd>
        </div>

        <div class="divider"></div>

        <button id="qs-mic" type="button" class="quick-setting">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <rect x="5" y="2" width="4" height="6" rx="2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M3.5 7a3.5 3.5 0 0 0 7 0M7 10.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="qs-label">Microphone</span>
          <span id="qs-mic-value" class="qs-value">System default</span>
          <svg class="qs-chev" viewBox="0 0 10 10" width="9" height="9" fill="none" aria-hidden="true">
            <path d="M3 2l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>

        <button id="qs-language" type="button" class="quick-setting">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2 7h10M7 2c1.5 2 1.5 8 0 10M7 2c-1.5 2-1.5 8 0 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span class="qs-label">Language</span>
          <span id="qs-language-value" class="qs-value">Auto-detect</span>
          <svg class="qs-chev" viewBox="0 0 10 10" width="9" height="9" fill="none" aria-hidden="true">
            <path d="M3 2l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="divider"></div>

        <button id="show-history" type="button" class="menu-item">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <path
              d="M3 11h8 M3 7h8 M3 3h8"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          <span class="menu-label">Show history</span>
        </button>

        <button id="insert-last" type="button" class="menu-item">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <path
              d="M3 7h8M8 4l3 3-3 3"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="menu-label">Insert last transcript</span>
        </button>

        <div class="divider"></div>

        <button id="show-settings" type="button" class="menu-item">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.3" />
            <path
              d="M7 1.5v1.5M7 11v1.5M1.5 7H3M11 7h1.5M3 3l1.05 1.05M9.95 9.95L11 11M3 11l1.05-1.05M9.95 4.05L11 3"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
          <span class="menu-label">Settings…</span>
          <span class="menu-accel mono">⌘ ,</span>
        </button>

        <button id="quit" type="button" class="menu-item">
          <svg viewBox="0 0 14 14" width="14" height="14" fill="none" aria-hidden="true">
            <path
              d="M5 3v8m4-8v8"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          <span class="menu-label">Quit opennib</span>
          <span class="menu-accel mono">⌘ Q</span>
        </button>
      </section>

      <!-- ─── mic submenu view ───────────────────────────────────── -->
      <section id="view-mic" class="view" hidden>
        <header class="submenu-head">
          <button class="submenu-back" data-back type="button" aria-label="Back">
            <svg viewBox="0 0 10 10" width="9" height="9" fill="none" aria-hidden="true">
              <path d="M7 2L4 5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="submenu-title">Microphone</span>
        </header>
        <ul id="mic-list" class="picker-list"></ul>
      </section>

      <!-- ─── language submenu view ──────────────────────────────── -->
      <section id="view-language" class="view" hidden>
        <header class="submenu-head">
          <button class="submenu-back" data-back type="button" aria-label="Back">
            <svg viewBox="0 0 10 10" width="9" height="9" fill="none" aria-hidden="true">
              <path d="M7 2L4 5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="submenu-title">Language</span>
        </header>
        <ul id="language-list" class="picker-list"></ul>
      </section>
    </div>
    <script type="module" src="./tray.ts"></script>
  </body>
</html>
